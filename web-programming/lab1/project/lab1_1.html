<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>1.1 Радевич-Винницький КІ-402</title>
</head>

<body>
    <script>
        "use strict";
        alert("Привіт!");
        const answer = confirm("Хочете продовжити виконання сценарію на JavaScript?");
        if (answer) {
            const name = prompt("Введіть ваше ім'я", "");
            alert(name + ", бажаю тобі гарного дня!");
        }
        else alert("Шкода, можна було б ще попрацювати!");
    </script>
</body>

</html>
