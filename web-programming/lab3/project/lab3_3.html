<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <title>3.3 Радевич-Винницький КІ-402</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }
        #quote {
            font-size: 24px;
            font-style: italic;
            color: #333;
            margin: 20px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Генератор випадкових цитат</h1>
    <div id="quote">Натисніть кнопку, щоб отримати цитату!</div>
    <button onclick="showRandomQuote()">Отримати цитату</button>

    <script>
        "use strict";

        const quotes = [
            "Життя — це те, що з тобою відбувається, поки ти будуєш плани.",
            "Успіх — це вміння йти від однієї невдачі до іншої, не втрачаючи ентузіазму.",
            "Найкращий спосіб почати — перестати говорити і почати робити.",
            "Ти ніколи не перетнеш океан, якщо не наважишся втратити берег із виду.",
            "Найбільший ризик — не ризикувати ніколи.",
            "Мрії не працюють, поки не працюєш ти.",
            "Все, що ти можеш уявити, — реально.",
            "Не бійся йти повільно, бійся стояти на місці."
        ];

        function showRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length); 
            const quoteElement = document.getElementById("quote");
            quoteElement.textContent = quotes[randomIndex]; 
        }
    </script>
</body>
</html>
