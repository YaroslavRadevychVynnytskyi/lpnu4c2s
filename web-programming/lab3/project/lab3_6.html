<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <title>3.6 Радевич-Винницький КІ-402</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }
        h2 {
            color: #333;
        }
        .result {
            font-size: 24px;
            color: #007bff;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Демонстрація передачі функції як аргументу</h2>

    <script>
        "use strict";

        function square(a) {
            return a * a;
        }

        function polinom(a, k) {
            return k(a) + a + 5;
        }

        let result = polinom(4, square);

        document.write(`<div class="result">Результат: ${result}</div>`);
    </script>
</body>
</html>
